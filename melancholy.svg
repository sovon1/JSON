<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes drift {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.5; }
        50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.5; }
      }
      
      @keyframes pulse {
        0% { r: 3; opacity: 0.3; }
        50% { r: 6; opacity: 0.7; }
        100% { r: 3; opacity: 0.3; }
      }

      @keyframes fadeText {
        0% { opacity: 0.2; }
        50% { opacity: 0.6; }
        100% { opacity: 0.2; }
      }

      .node {
        fill: #94a3b8;
        animation: pulse 4s infinite ease-in-out;
      }

      .node:hover {
        fill: #e2e8f0;
        animation: pulse 1s infinite ease-in-out;
        cursor: pointer;
      }

      .connection {
        stroke: #334155;
        stroke-width: 1;
        fill: none;
      }

      .solitary {
        animation: drift 10s infinite ease-in-out;
      }

      .solitary:hover {
        animation-play-state: paused;
      }

      .text-melancholy {
        fill: #475569;
        font-family: monospace;
        font-size: 14px;
        animation: fadeText 8s infinite ease-in-out;
        letter-spacing: 2px;
      }
      
      .text-melancholy:hover {
        fill: #94a3b8;
        opacity: 1 !important;
        animation: none;
        transition: fill 0.5s ease, opacity 0.5s ease;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" />

  <!-- Abstract Connections (representing broken or lonely data structures) -->
  <path class="connection" d="M 100 150 Q 250 50 400 150 T 700 150" stroke-dasharray="5 15" />
  <path class="connection" d="M 150 250 Q 300 200 450 250 T 750 200" stroke-dasharray="2 8" opacity="0.5" />

  <!-- Drifting Solitary Element -->
  <g class="solitary">
    <!-- Center lonely node -->
    <circle cx="400" cy="150" r="15" fill="#1e293b" stroke="#475569" stroke-width="2" filter="url(#glow)" />
    <text x="400" y="155" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">{ }</text>
    
    <!-- Satellites -->
    <circle cx="360" cy="120" class="node" style="animation-delay: 0s;" />
    <circle cx="450" cy="170" class="node" style="animation-delay: 1s;" />
    <circle cx="420" cy="110" class="node" style="animation-delay: 2s;" />
    
    <!-- faint lines to satellites -->
    <line x1="400" y1="150" x2="360" y2="120" stroke="#334155" stroke-width="0.5" />
    <line x1="400" y1="150" x2="450" y2="170" stroke="#334155" stroke-width="0.5" />
    <line x1="400" y1="150" x2="420" y2="110" stroke="#334155" stroke-width="0.5" />
  </g>

  <!-- Far away drifting elements -->
  <g class="solitary" style="animation-delay: -5s; animation-duration: 15s;">
    <circle cx="200" cy="80" r="4" fill="#334155" />
    <text x="200" y="95" class="text-melancholy" text-anchor="middle">null</text>
  </g>

  <g class="solitary" style="animation-delay: -2s; animation-duration: 12s;">
    <circle cx="650" cy="220" r="5" fill="#334155" />
    <text x="650" y="240" class="text-melancholy" text-anchor="middle">undefined</text>
  </g>

  <!-- Title Text -->
  <text x="50%" y="270" class="text-melancholy" text-anchor="middle">In the vastness of memory, data persists.</text>
</svg>
